name: Windows validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test, lint and build frontend
        run: npm run check
      - name: Compile and test native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
